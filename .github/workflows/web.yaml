name: Web

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  releases-matrix:
    name: Release Web
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v2
        with:
          go-version: '1.22.2'

      - name: Install make
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Checkout original repo
        uses: actions/checkout@v3
        with:
          repository: juan-medina/twitch-rat
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wasm
        run: make wasm

      - name: Make zip with the wasm project with the tag number
        run: |
          cd build/web
          zip -r "${{ github.event.repository.name }}-${{ github.event.release.name }}-web.zip" *
      
      - name: Add file to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "${{ github.event.repository.name }}-${{ github.event.release.name }}-web.zip"
          asset_name: "${{ github.event.repository.name }}-${{ github.event.release.name }}-web.zip"
          tag: ${{ github.ref }}
          overwrite: true
