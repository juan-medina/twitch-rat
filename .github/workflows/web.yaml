name: Web

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  releases-matrix:
    name: Release Web
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v2
        with:
          go-version: '1.22.2'

      - name: Install make
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Checkout original repo
        uses: actions/checkout@v3
        with:
          repository: juan-medina/twitch-rat
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wasm
        run: make wasm

      - name: Archive build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-directory
          path: build/web        

      - name: Clone blog repo
        uses: actions/checkout@v3
        with:
          repository: juan-medina/blog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifact      
        uses: actions/download-artifact@v4
        with:
          name: build-directory
          path: build-directory

      - name: Copy wasm to blog repo
        run: |
          find .
          rm -rf blog/docs/twitch-rat
          mkdir -p blog/docs/twitch-rat
          cp build-directory/* blog/docs/twitch-rat
          rm -rf build-directory

      - name: Push to blog repo
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          directory: blog
          author_name: Juan Medina
          author_email: jamedina@gmail.com
          commit_message: "Twitch Rat Release v${{ github.event.release.tag_name }}"
